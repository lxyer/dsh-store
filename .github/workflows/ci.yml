name: ci

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm validate
      - run: pnpm --filter @dsh-store/scanner test
      - run: pnpm --filter @dsh-store/site test
      - run: pnpm --filter @dsh-store/plugin test
      - name: reject candidate installable promotions
        run: |
          if grep -R "trustState: installable" registry/candidates -n; then
            echo "candidates cannot be installable" >&2
            exit 1
          fi
          if grep -R "trustState: featured" registry/candidates -n; then
            echo "candidates cannot be featured" >&2
            exit 1
          fi
